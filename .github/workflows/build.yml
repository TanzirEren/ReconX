name: Build ReconX v1.1.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-gradle installs Gradle 8.5 as system command — no wrapper needed
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        # Retry once on failure (handles transient Maven Central network issues)
        run: gradle assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ReconX-v1.1.1
          path: app/build/outputs/apk/debug/*.apk
