plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tenix.recon'
    compileSdk 34
    defaultConfig {
        applicationId "com.tenix.recon"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.1"
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {}
